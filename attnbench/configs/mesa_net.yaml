# attnbench: 只测 mesa_net（fla 固定 commit 6ec0988 版本）
# CLI overrides take precedence (e.g. --batch 1,4,8 --seq 512,2048,8192)

model:
  vocab_size: 32000
  n_layers: 24
  dim: 1024
  n_heads: 8            # head_dim = 1024 // 8 = 128
  expand_ratio: 4
  use_short_conv: true
  conv_size: 4

variants: [mesa_net]
variant_opts: {}

specs:
  batch_sizes: [1, 4, 8]
  seq_lens: [512, 2048, 8192]

decode:
  new_tokens: 256

bench:
  dtype: bfloat16
  warmup: 3
  iters: 10
  seed: 0
  microbench: true

report:
  out_dir: results
  formats: [table, json, csv]
  tag: mesa_6ec0988
