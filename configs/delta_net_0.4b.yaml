# =============================================================================
# 0.4B DeltaNet —— 训练配置
#
# 数值全部来自 D:\Users\邱培林\Desktop\delta_net.md：
#   vocab 32000 / 24 层 / hidden 1024 / 8 头   ->  ~0.4B 参数
#   20B tokens，seq_len 2048，0.5M tokens/batch，Muon，
#   lr: embedding 2e-1 / hidden 2e-2 / unembedding 2e-3，
#   linear warmup + cosine decay，warmup ratio 0.005
#
# 与论文 (arXiv:2406.06484) 的关系见 README「五、与论文配置的差异」。
# =============================================================================

model:
  vocab_size: 32000
  n_layers: 24
  dim: 1024
  n_heads: 8
  expand_ratio: 4
  norm_eps: 1.0e-5
  tie_word_embeddings: false
  attn_impl: delta_net

  # DeltaNet 内核（fla.layers.delta_net.DeltaNet）
  dn_mode: chunk            # 训练用 chunk 并行形式；fused_recurrent 只适合解码
  dn_expand_k: 1.0
  dn_expand_v: 1.0
  dn_use_gate: true         # 输出门（g_proj + FusedRMSNormGated），对齐 fla 的 DeltaNetForCausalLM
  dn_use_short_conv: true   # q/k/v 上的短卷积，关掉会明显掉点
  dn_conv_size: 4
  dn_allow_neg_eigval: false
  dn_qk_activation: silu
  dn_qk_norm: l2

training:
  tokens: 20000000000        # 实际训练 token 数
  # 只训 20B，但余弦衰减按 40B 走完：跑到第 19073 步（20B）就停，
  # 此时 lr 仍是峰值的约 55%，相当于"原计划训 40B、提前一半收工"。
  schedule_tokens: 40000000000
  seq_len: 2048
  # 0.5M tokens/batch = 2^19，= 256 条 2048 序列
  global_batch_tokens: 524288
  # 每卡每次 forward 的序列数。实测 32 条 × 2048 需要约 80 GB 显存（83 GB 卡会 OOM），
  # 16 条约 40 GB，80 GB 的 H100 也安全。显存更大可试 32。
  micro_batch_size: 16

  lr_embed: 0.2              # AdamW，输入 embedding
  lr_hidden: 0.02            # Muon，所有 2-D 隐层矩阵
  lr_head: 0.002             # AdamW，lm_head（unembedding）

  warmup_ratio: 0.005        # 相对于 schedule_tokens 的步数
  min_lr_ratio: 0.1          # cosine 衰减到峰值 lr 的 10%

  # 分组权重衰减，对齐上游 muon.yaml（实测 gdn/gla/kda 三个 baseline 都是这样）
  weight_decay_muon: 0.1     # Muon，所有 2-D 隐层矩阵
  weight_decay_embed: 0.01   # AdamW，输入 embedding
  weight_decay_head: 0.01    # AdamW，lm_head
  weight_decay_other: 0.0    # AdamW，norm gain / 短卷积 kernel

  # 参数精度：bf16 主权重（= v3 的配置），做「v3 + 输出门」的单变量对照。
  # 已知代价：val_loss 会比 fp32 高约 0.04 nat。
  param_dtype: bfloat16

  # 初始化：lmtemplate 不做自定义初始化（就是 PyTorch 默认），所以这里保持 0。
  # （fla 的 DeltaNetForCausalLM 用 normal(0, 0.02)；想对齐它就把这里改成 0.02。
  #   两种只影响起点，不影响结构。）
  init_std: 0.0
  # checkpoint 里权重和优化器状态存成 bf16：3.2 GiB -> ~1.6 GiB
  # （训练本身仍是 fp32 主权重 + bf16 autocast；续跑时自动转回 fp32）
  save_dtype: bf16
  adam_beta1: 0.9
  adam_beta2: 0.95
  muon_momentum: 0.95
  muon_ns_steps: 5

  seed: 1337
  log_every: 10
  save_every: 500            # 每 500 步存一次（≈2.6 亿 tokens）
  keep_last: 3               # 只保留最近 3 个 checkpoint
  eval_every: 1000           # 每 1000 步在验证集上算一次 loss（0 = 关闭）
  eval_batches: 20           # 每次验证的 batch 数

# 训练时在线 tokenize（不再需要预先 prepare_data.py 生成 train.bin）
data:
  source: /nas/datasets/karpathy--fineweb-edu-100b   # 存放 .parquet 的目录
  tokenizer: ./tokenizer                             # 换 tokenizer 只改这里
  val_files: 20            # 最后 20 个 parquet 文件留作验证集（不参与训练）
  val_tokens: 10000000     # 启动时把这么多 token 编码进内存作为验证集
  batch_docs: 256          # 每次编码多少篇文档
  eos_id: 2
